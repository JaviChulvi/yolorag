# Fair vector-DB benchmark harness. All four vendors run with IDENTICAL resource
# caps so throughput/latency are comparable, plus the backend that serves
# /api/benchmark (with embeddings/ mounted for query sampling + recall).
#
#   docker network create yr_net 2>/dev/null || true   # not needed; this stack is self-contained
#   docker compose -f docker-compose.bench.yml up -d --build
#   # then ingest the pre-computed embeddings into each vendor:
#   for p in postgresql mongodb qdrant milvus; do \
#     docker compose -f docker-compose.bench.yml exec -T backend \
#       python -m yolorag.scripts.ingest_image_embeddings /data/embeddings --provider $p; done
#   # then run the frontend (npm run dev) and open the Benchmark page, or:
#   curl -s -X POST localhost:8000/api/benchmark -H 'content-type: application/json' -d '{}'
#
# Fairness: single-container vendors (postgres/mongodb/qdrant) and the milvus query
# container all get the same cap (YOLORAG_BENCH_CPUS / YOLORAG_BENCH_MEM). etcd + MinIO
# are Milvus's mandatory scaffolding and get small fixed allocations. Providers are
# benchmarked sequentially by the runner so they never contend for host CPU.
name: yolorag-bench

x-vendor-caps: &vendor-caps
  cpus: 2
  mem_limit: 4g
  memswap_limit: 4g

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: yolorag
      POSTGRES_USER: yolorag
      POSTGRES_PASSWORD: yolorag
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolorag -d yolorag"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *vendor-caps

  mongodb:
    build:
      context: .
      dockerfile: Dockerfile.mongodb
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 15
    <<: *vendor-caps

  qdrant:
    build:
      context: .
      dockerfile: Dockerfile.qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 10s
      timeout: 5s
      retries: 15
    <<: *vendor-caps

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    cpus: 1
    mem_limit: 1g

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    cpus: 1
    mem_limit: 1g

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 90s
      timeout: 10s
      retries: 8
    depends_on:
      - etcd
      - minio
    <<: *vendor-caps

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      YOLORAG_EMBEDDINGS_DIR: /data/embeddings
      YOLORAG_BENCH_DATA_DIR: /data/bench_data
      YOLORAG_BENCH_CPUS: "2"
      YOLORAG_BENCH_MEM: "4g"
      YOLORAG_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      YOLORAG_POSTGRES_DSN: postgresql+psycopg://yolorag:yolorag@postgres:5432/yolorag
      YOLORAG_MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      YOLORAG_QDRANT_URL: http://qdrant:6333
      YOLORAG_MILVUS_URI: http://milvus:19530
    volumes:
      - ./embeddings:/data/embeddings:ro
      - ./bench_data:/data/bench_data
    depends_on:
      - postgres
      - mongodb
      - qdrant
      - milvus

  # Serves the console (incl. the Benchmark page) at http://localhost:8080;
  # nginx proxies /api -> backend:8000.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pg_data:
  mongo_data:
  qdrant_data:
  etcd_data:
  minio_data:
  milvus_data:
