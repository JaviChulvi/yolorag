[project]
name = "yolorag"
version = "0.1.0"
description = "Provider-agnostic RAG orchestrator prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "genai-prices",
  "openai",
  "python-dotenv",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
