# Milvus standalone stack (milvus + etcd + MinIO) for the image-embeddings vendor eval.
# Unlike the pg/mongo/qdrant single-container images, Milvus needs etcd (metadata) and
# MinIO (object storage). Structure creation is handled by the store's ensure_schema().
#
#   docker network create yr_net   # once, shared with the other vendor containers
#   docker compose -f deploy/milvus/docker-compose.yml up -d
#
# Milvus is then reachable at yr-milvus:19530 on yr_net (and localhost:19530 from the host).
# NB: service hostnames use hyphens, not underscores -- the MinIO Go client rejects
# hostnames with underscores ("Invalid Request (invalid hostname)").
name: yolorag-milvus

services:
  etcd:
    container_name: yr-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [yr_net]

  minio:
    container_name: yr-milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [yr_net]

  milvus:
    container_name: yr-milvus
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: yr-milvus-etcd:2379
      MINIO_ADDRESS: yr-milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks: [yr_net]

networks:
  yr_net:
    external: true

volumes:
  etcd_data:
  minio_data:
  milvus_data:
